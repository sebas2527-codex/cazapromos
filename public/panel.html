<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CazaPromos — Tu panel</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
  html,body { overflow-x:hidden; }
  body { background:#121212; color:#eee; padding:20px; max-width:600px; margin:0 auto; }
  h1 { color:#0E9BA4; font-size:22px; } h2 { color:#0E9BA4; font-size:17px; margin:16px 0 10px; }
  .box { background:#1e1e1e; border-radius:12px; padding:15px; margin-top:15px; }
  label { display:block; margin:8px 0 4px; font-size:13px; color:#0E9BA4; }
  input, select { width:100%; padding:11px; border-radius:8px; border:1px solid #333; background:#121212; color:#eee; font-size:15px; min-height:44px; }
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; }
  input[type=file] { padding:8px; }
  .fila { display:flex; gap:10px; } .fila > div { flex:1; }
  button { width:100%; margin-top:12px; padding:13px; border:none; border-radius:10px; background:#0E9BA4; color:#fff; font-weight:bold; font-size:15px; cursor:pointer; min-height:46px; }
  button:disabled { background:#555; color:#999; cursor:not-allowed; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#121212; border-radius:8px; padding:10px; margin-top:8px; font-size:14px; }
  .st-pending { color:#FFC107; } .st-approved { color:#4CAF50; } .st-rejected { color:#e57373; }
  #msg { margin-top:10px; color:#4CAF50; min-height:18px; }
  a.salir { color:#aaa; font-size:13px; }
  .hint { font-size:12px; margin-top:4px; min-height:14px; }
  .hint.ok { color:#4CAF50; } .hint.warn { color:#FFC107; } .hint.err { color:#e57373; }
  .lead { background:#121212; border-radius:8px; padding:10px; margin-top:8px; font-size:13px; }
  .lead small { color:#aaa; display:block; }
  .lead .btns { display:flex; gap:6px; margin-top:8px; }
  .lead .btns button { width:auto; flex:1; margin:0; padding:8px; font-size:13px; }
</style>
</head>
<body>
<h1 id="hola">Hola</h1>
<a class="salir" href="/restaurante.html">← Salir (volver al login)</a>
<div class="box" id="cajaPlan"></div>

<div class="box">
  <h2>➕ Nueva promo</h2>
  <div id="form">
    <p id="notaPlan" style="color:#e57373;display:none;margin-bottom:8px">🔒 Elige y confirma un plan para poder publicar.</p>
    <label>Título</label><input id="title" placeholder="Ej: Combo de piqueos"><div class="hint" id="hintTitle"></div>
    <label>Descripción</label><input id="desc" placeholder="Ej: Piqueo + limonada"><div class="hint" id="hintDesc"></div>
    <div class="fila">
      <div><label>Categoría</label>
        <select id="cat">
          <option value="hamburguesas">Hamburguesas</option><option value="pizza">Pizza</option>
          <option value="alitas">Alitas</option><option value="platos_fuertes">Platos fuertes</option>
          <option value="sopas">Sopas</option><option value="sushi">Sushi</option>
          <option value="fideos">Fideos</option><option value="mariscos">Mariscos</option>
          <option value="postres">Postres</option><option value="bebidas">Bebidas</option>
          <option value="otros">Otros</option>
        </select><div class="hint" id="hintCat"></div>
      </div>
      <div><label>Foto del plato</label><input id="foto" type="file" accept="image/*"><div class="hint" id="hintFoto"></div></div>
    </div>
    <div class="fila">
      <div><label>Precio normal ($)</label><input id="pn" type="number" step="0.01" min="0" placeholder="Ej: 10"></div>
      <div><label>Precio promo ($)</label><input id="pp" type="number" step="0.01" min="0" placeholder="Ej: 7.50"></div>
    </div>
    <div class="fila" id="horasRow">
      <div><label>Abre</label><input id="abre" type="time" value="09:00"></div>
      <div><label>Cierra</label><input id="cierra" type="time" value="21:00"></div>
    </div>
    <button id="btnCrear">Enviar a revisión 📨</button>
    <div id="msg"></div>
  </div>
</div>

<div class="box">
  <h2>💰 Ventas a clientes</h2>
  <p id="cupStats" style="color:#4CAF50;font-size:14px"></p>
  <div id="leadsList"></div>
  <label>Código del cliente (opcional)</label>
  <input id="cupCode" placeholder="Ej: A1B2C3" style="text-transform:uppercase">
  <button id="btnRedimir">✅ Marcar como vendido</button>
  <div id="cupMsg" style="color:#4CAF50;font-size:13px;margin-top:6px"></div>
</div>

<h2>📋 Mis promos</h2>
<div id="lista"></div>
<script src="/panel.js"></script>
</body>
</html>
