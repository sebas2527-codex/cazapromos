<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CazaPromos — Jefe</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
  body{background:#121212;color:#eee;padding:20px;max-width:1000px;margin:0 auto;}
  h1{color:#FFC107;} h2{color:#FFC107;font-size:17px;margin:16px 0 10px;}
  .tabs{display:flex;gap:4px;margin:14px 0;border-bottom:2px solid #2a2a30;flex-wrap:wrap;}
  .tab{padding:10px 14px;background:#1e1e1e;border:none;border-radius:8px 8px 0 0;color:#aaa;cursor:pointer;font-size:14px;}
  .tab.on{background:#FFC107;color:#121212;font-weight:bold;}
  .pane{display:none;} .pane.on{display:block;}
  .item{display:flex;gap:10px;align-items:center;background:#1e1e1e;border-radius:10px;padding:10px;margin-top:10px;}
  .mini{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;}
  .info{flex:1;font-size:14px;} .info small{color:#aaa;}
  button{border:none;border-radius:8px;padding:9px 12px;font-size:15px;cursor:pointer;margin-left:4px;}
  .ok{background:#4CAF50;color:#fff;} .no{background:#e57373;color:#fff;}
  .ver{background:#eee;color:#121212;} .gris{background:#555;color:#fff;font-size:13px;}
  a.salir{color:#aaa;font-size:13px;}
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9;overflow:auto;padding:30px 15px;}
  #modalCaja{max-width:340px;margin:0 auto;}
  #cerrar{position:fixed;top:12px;right:16px;background:#FFC107;color:#121212;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;z-index:10;}
  .card{background:#1c1c22;border-radius:16px;overflow:hidden;}
  .cover{position:relative;height:170px;background:#26262c;}
  .cover img{width:100%;height:100%;object-fit:cover;}
  .nofoto{display:flex;align-items:center;justify-content:center;height:100%;font-size:54px;}
  .badge{position:absolute;top:10px;right:10px;background:#FFC107;color:#121212;font-weight:900;padding:6px 10px;border-radius:10px;font-size:16px;}
  .cuerpo{padding:14px;} .cuerpo h3{color:#fff;font-size:17px;}
  .rest{color:#FFC107;font-size:13px;margin:4px 0;} .desc{color:#99a;font-size:13px;}
  .prices{margin:8px 0;font-size:19px;}
  .old{text-decoration:line-through;color:#777;margin-right:8px;font-size:15px;}
  .new{color:#4CAF50;font-weight:900;}
  #mapa{height:400px;border-radius:12px;margin-top:10px;}
  .statsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px;}
  .stat{background:#1e1e1e;border-radius:10px;padding:12px;text-align:center;}
  .stat b{color:#FFC107;font-size:22px;display:block;}
</style>
</head>
<body>
<h1>🕵️ Panel del Jefe</h1>
<a class="salir" href="/restaurante.html">← Salir</a>
<div class="tabs">
  <button class="tab on" data-t="pend">⏳ Pendientes</button>
  <button class="tab" data-t="pub">✅ Publicadas</button>
  <button class="tab" data-t="loc">🏪 Locales</button>
  <button class="tab" data-t="ana">📊 Analítica</button>
  <button class="tab" data-t="log">🧾 Log</button>
</div>
<div id="p-pend" class="pane on"><div id="pendientes"></div></div>
<div id="p-pub" class="pane"><div id="publicadas"></div></div>
<div id="p-loc" class="pane"><div id="locales"></div></div>
<div id="p-ana" class="pane">
  <div class="statsGrid" id="stats"></div>
  <h2>🗺️ Zonas de clientes (clicks en promos)</h2>
  <div id="mapa"></div>
  <div id="listaTop" style="margin-top:12px"></div>
</div>
<div id="p-log" class="pane"><div id="logList"></div></div>
<div id="modal"><button id="cerrar">✖ Cerrar</button><div id="modalCaja"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/admin.js"></script>
</body>
</html>
